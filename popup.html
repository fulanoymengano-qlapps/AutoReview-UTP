<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"> <title>Auto Calificador</title>
  <style>
    body { font-family: sans-serif; padding: 15px; width: 320px; background-color: #f4f7f6; color: #333; }
    h2 { color: #2c3e50; margin-bottom: 20px; text-align: center; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input[type="date"], input[type="number"], select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #2980b9;
    }
    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
      text-align: center;
    }
    .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .status-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .status-info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

  </style>
</head>
<body>
  <h2>Configurar Calificación</h2>

  <label for="fechaNacimiento">Fecha de Nacimiento:</label>
  <input type="date" id="fechaNacimiento" value="2005-07-17">

  <label for="edad">Edad:</label>
  <input type="number" id="edad" value="19" min="1" max="100">

  <label for="preguntaSiNo">Pregunta 1 (Sí/No):</label>
  <select id="preguntaSiNo">
    <option value="5">Sí</option>
    <option value="0">No</option>
  </select>

  <label for="otrasPreguntas">Preguntas 2-15 (Sobresaliente, etc.):</label>
  <select id="otrasPreguntas">
    <option value="5">Sobresaliente</option>
    <option value="4">Bueno</option>
    <option value="3">Satisfactorio</option>
    <option value="2">Regular</option>
    <option value="1">Deficiente</option>
  </select>

  <button id="saveAndRateButton">Guardar y Calificar</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
